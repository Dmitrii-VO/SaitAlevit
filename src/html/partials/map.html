<!-- MAP - Карта объектов -->
<!-- ============================================ -->
<section class="map" id="map">
  <div class="map__image-wrapper">
    <img
      src="images/backgrounds/map-background.webp"
      alt=""
      class="map__image"
      loading="lazy"
    />
    <div class="map__overlay"></div>
  </div>
  <div class="map__container">
    <h2 class="map__title">Карта объектов</h2>
    <p class="map__subtitle">
      Дома и участки на карте Белгорода и области
    </p>

    <!-- Легенда -->
    <div class="map__legend">
      <div class="map__legend-item"><span class="map__legend-color map__legend-color--red"></span><span class="map__legend-text">Дом построен и сдан</span></div>
      <div class="map__legend-item"><span class="map__legend-color map__legend-color--yellow"></span><span class="map__legend-text">Дом строится</span></div>
      <div class="map__legend-item"><span class="map__legend-color map__legend-color--green"></span><span class="map__legend-text">Дом построен и готов к продаже</span></div>
      <div class="map__legend-item"><span class="map__legend-color map__legend-color--orange"></span><span class="map__legend-text">Свободный участок</span></div>
    </div>

    <!-- Контейнер для Яндекс Карт -->
    <div class="map__content" id="yandex-map"></div>
    <div class="map__locations">{{MAP_LINKS}}</div>
  </div>
</section>
